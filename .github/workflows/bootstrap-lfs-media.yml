name: Bootstrap Workspace media sources

on:
  push:
    branches: [agent/workspace-media-lfs]
    paths:
      - .github/workflows/bootstrap-lfs-media.yml
      - .bootstrap-workspace-lfs/**

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Restore media-store contract
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-workspace-lfs/workspace-media-store.tar.gz.b64 \
            | tar --extract --gzip --file -
          chmod +x scripts/00-repo/00-09-lfs-check.sh
      - name: Configure Git LFS
        run: git lfs install --local
      - name: Download pinned logo sources
        env:
          SOURCE_COMMIT: b1b385dba7e757f88f715db5e69e229b631bc7aa
        run: |
          set -euo pipefail
          mkdir -p assets/3d/source
          declare -A expected_sizes=(
            [greenways-3d-logo.glb]=61698152
            [greenways-os-logo.glb]=60512588
            [hestia-logo.glb]=62549112
            [historia-3d-logo.glb]=61123424
            [hodos-3d-logo.glb]=63892924
          )
          for name in "${!expected_sizes[@]}"; do
            url="https://raw.githubusercontent.com/greenways-ai/greenways-ai.github.io/${SOURCE_COMMIT}/assets/3d/${name}"
            target="assets/3d/source/${name}"
            curl --fail --location --retry 4 --retry-all-errors --output "$target" "$url"
            actual_size="$(stat --format=%s "$target")"
            if [[ "$actual_size" != "${expected_sizes[$name]}" ]]; then
              echo "Unexpected size for $name: $actual_size" >&2
              exit 1
            fi
          done
      - name: Write source manifest
        env:
          SOURCE_COMMIT: b1b385dba7e757f88f715db5e69e229b631bc7aa
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("assets/3d/source")
          commit = os.environ["SOURCE_COMMIT"]
          assets = []
          for path in sorted(root.glob("*.glb")):
              payload = path.read_bytes()
              assets.append({
                  "path": path.as_posix(),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "origin": (
                      "https://github.com/greenways-ai/greenways-ai.github.io/"
                      f"blob/{commit}/assets/3d/{path.name}"
                  ),
              })
          manifest = {
              "protocol": "greenways.workspace-media-source/1",
              "originRepository": "greenways-ai/greenways-ai.github.io",
              "originCommit": commit,
              "assets": assets,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Validate and publish LFS media store
        shell: bash
        run: |
          set -euo pipefail
          git add .gitattributes AGENTS.md ARCHITECTURE.md assets scripts/00-repo
          make repo-lfs-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Workspace Git LFS media store"
          git push origin "HEAD:${GITHUB_REF_NAME}"
