name: Import logo GLBs into Workspace LFS

on:
  workflow_dispatch:
  push:
    paths:
      - assets/3d/logo-sources.json
      - scripts/media/import-logo-models.mjs
      - .gitattributes
      - .github/workflows/import-logo-models.yml

permissions:
  contents: write

concurrency:
  group: import-logo-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize Git LFS
        run: git lfs install --local
      - name: Import pinned logo model sources
        run: node scripts/media/import-logo-models.mjs
      - name: Verify and stage LFS pointers
        run: |
          git add assets/3d/source
          git lfs fsck --pointers
          for model in \
            assets/3d/source/greenways-3d-logo.glb \
            assets/3d/source/greenways-os-logo.glb \
            assets/3d/source/hestia-logo.glb \
            assets/3d/source/historia-3d-logo.glb \
            assets/3d/source/hodos-3d-logo.glb; do
            test "$(git check-attr filter -- "$model" | sed 's/.*: //')" = lfs
            git lfs ls-files --name-only | grep -Fx "$model"
          done
      - name: Commit imported LFS objects
        run: |
          if git diff --cached --quiet; then
            echo "Pinned logo models are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import logo GLBs into Workspace LFS"
          git lfs push origin HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
